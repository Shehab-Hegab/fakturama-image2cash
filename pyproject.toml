[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-image2cash"
version = "0.1.0"
description = "Automate Fakturama desktop: one order image to a verified Order plus a linked Invoice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywinauto>=0.6.8",
    "pydantic>=2.7,<3",
    "Pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.scripts]
fakturama-i2c = "fakturama_i2c.cli:main"

[tool.setuptools.packages.find]
where = ["src"]